version: '3.8'

services:
  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: hot-blooded-qa-mongo
    restart: always
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - "27017:27017"

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hot-blooded-qa-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/${MONGO_DB:-questionnaire}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      NODE_ENV: production
    ports:
      - "3000:3000"

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hot-blooded-qa-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:5173"

  # Nginx反向代理（用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: hot-blooded-qa-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"

networks:
  default:
    name: hot-blooded-qa-network
